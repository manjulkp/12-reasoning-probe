[project]
name = "reasoning-probe"
version = "0.1.0"
description = "Probe how much a small reasoning model gains from thinking on grade-school maths"
requires-python = ">=3.12"
dependencies = ["accelerate>=1.0", "datasets>=3.0", "torch>=2.9", "transformers>=4.50"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
